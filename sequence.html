<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sequence Grid Visualizer</title>
    <link rel="stylesheet" href="sequence.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <div class="control-panel">
            <h1>Sequence Visualizer</h1>
            
            <div class="control-group">
                <label for="sequenceType">Sequence</label>
                <select id="sequenceType" class="premium-input">
                    <option value="primes">Primes (Ulam Spiral-esque)</option>
                    <option value="random">Random Walk</option>
                </select>
            </div>

            <div class="control-group">
                <label for="startDirection">Start Direction</label>
                <select id="startDirection" class="premium-input">
                    <option value="0">Right (or Down-Right)</option>
                    <option value="1">Down (or Down-Left)</option>
                    <option value="2">Left (or Up-Left)</option>
                    <option value="3">Up (or Up-Right)</option>
                </select>
            </div>

            <div class="control-group" id="turnDirectionGroup">
                <label for="turnDirection">Turn Direction (Primes)</label>
                <select id="turnDirection" class="premium-input">
                    <option value="right">Turn Right</option>
                    <option value="left">Turn Left</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Axis Mode</label>
                <div class="toggle-container">
                    <span class="toggle-label" id="label-orthogonal">Orthogonal</span>
                    <label class="switch">
                        <input type="checkbox" id="axisMode">
                        <span class="slider round"></span>
                    </label>
                    <span class="toggle-label" id="label-diagonal">Diagonal</span>
                </div>
            </div>

            <div class="control-group">
                <label for="speedControl">Steps per Frame: <span id="speedValue">50</span></label>
                <input type="range" id="speedControl" min="1" max="1000" value="50" class="premium-slider">
            </div>

            <div class="control-group">
                <label for="zoomControl">Zoom: <span id="zoomValue">10</span>px/unit</label>
                <input type="range" id="zoomControl" min="1" max="50" value="10" class="premium-slider">
            </div>

            <div class="button-group">
                <button id="startBtn" class="btn primary">Start</button>
                <button id="pauseBtn" class="btn secondary">Pause</button>
                <button id="resetBtn" class="btn danger">Reset</button>
            </div>
            
            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">Steps</span>
                    <span class="stat-value" id="stepCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Current Num</span>
                    <span class="stat-value" id="currentNum">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Position</span>
                    <span class="stat-value" id="currentPos">(0, 0)</span>
                </div>
            </div>
            
            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
        
        <div class="canvas-container">
            <canvas id="gridCanvas"></canvas>
            <div class="instruction-overlay">
                <p>Drag to pan • Use slider to zoom</p>
            </div>
        </div>
    </div>
    
    <script src="sequence.js"></script>
</body>
</html>
